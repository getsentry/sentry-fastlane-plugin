name: Test

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: getsentry/action-setup-cli@70d7e587b84c2e78cf4d37cd33d7b74fb3729c1b # v1

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3.11"

      - run: bundle install
      - run: sentry-cli info --config-status-json
      - run: bundle exec rubocop
      - run: rspec
